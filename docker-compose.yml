services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    network_mode: "host"
    environment:
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
    volumes:
      - .:/app
      - /app/node_modules
    command: /bin/sh -c "npm install && npm run dev -- --host"
